name: Build & Test

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 🔄 Checkout code
        uses: actions/checkout@v3

      - name: 🧰 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm install

      - name: 🛠️ Build package
        run: npm run build

      # Optional test step (you can remove if not needed yet)
      - name: ✅ Run tests
        if: exists('test')
        run: npm test

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: dist
          path: dist/
